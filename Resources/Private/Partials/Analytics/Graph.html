<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<div class="tx-analytics-traffic-graph">
    <div class="tx-analytics-traffic-graph-legend">
        <span class="tx-analytics-traffic-graph-legend-item" data-tone="visits">
            <f:translate key="LLL:EXT:mai_seo/Resources/Private/Language/locallang_analytics.xlf:metric.visits" />
        </span>
        <span class="tx-analytics-traffic-graph-legend-item" data-tone="visitors">
            <f:translate key="LLL:EXT:mai_seo/Resources/Private/Language/locallang_analytics.xlf:metric.visitors" />
        </span>
    </div>
    <div class="tx-analytics-traffic-graph-chart-container">
        {report.charts.traffic -> f:format.raw()}
    </div>
</div>
