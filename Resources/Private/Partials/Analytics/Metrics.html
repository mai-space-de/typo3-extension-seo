<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<ul class="tx-analytics-site-performance-list">
    <f:for each="{report.metrics}" as="metric">
        <li class="tx-analytics-site-performance-metric tx-analytics-site-performance-metric-{metric.palette}">
            <span class="tx-analytics-site-performance-icon">
                <f:render partial="Analytics/Icon" arguments="{name: metric.icon}" />
            </span>
            <span class="tx-analytics-site-performance-value-row">
                <span class="tx-analytics-site-performance-value">{metric.display}</span>
                <f:if condition="{metric.trendDisplay}">
                    <span class="tx-analytics-site-performance-trend tx-analytics-site-performance-trend-{metric.trendClass}">
                        <f:if condition="{metric.direction} == 'up'">
                            <span class="tx-analytics-site-performance-trend-icon">
                                <f:render partial="Analytics/Icon" arguments="{name: 'trend-up'}" />
                            </span>
                        </f:if>
                        <f:if condition="{metric.direction} == 'down'">
                            <span class="tx-analytics-site-performance-trend-icon">
                                <f:render partial="Analytics/Icon" arguments="{name: 'trend-down'}" />
                            </span>
                        </f:if>
                        {metric.trendDisplay}
                    </span>
                </f:if>
            </span>
            <span class="tx-analytics-site-performance-label">
                <f:translate key="LLL:EXT:mai_seo/Resources/Private/Language/locallang_analytics.xlf:metric.{metric.key}" />
            </span>
        </li>
    </f:for>
</ul>
