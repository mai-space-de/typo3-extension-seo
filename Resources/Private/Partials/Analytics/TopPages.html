<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<div class="tx-analytics-top-pages">
    <ol class="tx-analytics-top-pages-list">
        <f:for each="{report.topPages}" as="page" iteration="iteration">
            <li class="tx-analytics-top-pages-row">
                <span class="tx-analytics-top-pages-position">{iteration.cycle}</span>
                <span class="tx-analytics-top-pages-title-cell">
                    <span class="tx-analytics-top-pages-title-group">
                        <span class="tx-analytics-top-pages-title">{page.title}</span>
                        <span class="tx-analytics-top-pages-slug">{page.path}</span>
                    </span>
                </span>
                <span class="tx-analytics-top-pages-bar" style="--mai-seo-share: {page.share}%;"><span></span></span>
                <span class="tx-analytics-top-pages-count">{page.visits}</span>
            </li>
        </f:for>
    </ol>
</div>
