services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Maispace\MaiSeo\:
        resource: '../Classes/*'
        exclude:
            - '../Classes/Domain/Model/*'
            - '../Classes/Event/*'
            - '../Classes/MetaTag/StructuredDataInjector.php'

    Maispace\MaiSeo\Service\PageLanguageAvailability:
        alias: Maispace\MaiSeo\Service\DatabasePageLanguageAvailability

    Maispace\MaiSeo\Analytics\AnalyticsStore:
        alias: Maispace\MaiSeo\Analytics\DoctrineAnalyticsStore

    Maispace\MaiSeo\Analytics\BackendUserDetector:
        alias: Maispace\MaiSeo\Analytics\ContextBackendUserDetector

    Maispace\MaiSeo\Schema\VocabularyRegistry:
        public: true

    Maispace\MaiSeo\StructuredData\StructuredDataService:
        public: true

    Maispace\MaiSeo\StructuredData\AutoGenerator:
        public: true

    Maispace\MaiSeo\StructuredData\PageRoleResolver:
        public: true

    Maispace\MaiSeo\StructuredData\RecordStorageResolver:
        public: true

    Maispace\MaiSeo\StructuredData\RecordStorageResolverInterface:
        alias: Maispace\MaiSeo\StructuredData\RecordStorageResolver
        public: true

    Maispace\MaiSeo\StructuredData\StructuredDataProviderInterface:
        alias: Maispace\MaiSeo\StructuredData\StructuredDataService
        public: true

    Maispace\MaiSeo\StructuredData\Collector\CollectorRegistry:
        public: true
        arguments:
            $collectors: !tagged_iterator maiseo.structured_data.collector

    Maispace\MaiSeo\DataProcessing\StructuredDataProcessor:
        public: true

    Maispace\MaiSeo\MetaTag\OpenGraphMetaTagGenerator:
        public: true

    Maispace\MaiSeo\MetaTag\OpenGraphValueResolver:
        public: true

    Maispace\MaiSeo\MetaTag\StructuredDataInjector:
        public: true

    Maispace\MaiSeo\Hook\PageRecordSaveHook:
        public: true

    Maispace\MaiSeo\Hook\ExtensionRecordSaveHook:
        public: true

    Maispace\MaiSeo\StructuredData\Collector\PageCollector:
        tags:
            - name: 'maiseo.structured_data.collector'

    Maispace\MaiSeo\StructuredData\Collector\BreadcrumbCollector:
        tags:
            - name: 'maiseo.structured_data.collector'

    Maispace\MaiSeo\StructuredData\Collector\NewsArticleCollector:
        tags:
            - name: 'maiseo.structured_data.collector'

    Maispace\MaiSeo\StructuredData\Collector\JobPostingCollector:
        tags:
            - name: 'maiseo.structured_data.collector'

    Maispace\MaiSeo\StructuredData\Collector\PersonCollector:
        tags:
            - name: 'maiseo.structured_data.collector'

    Maispace\MaiSeo\StructuredData\Collector\PlaceCollector:
        tags:
            - name: 'maiseo.structured_data.collector'

    Maispace\MaiSeo\StructuredData\Collector\OrganizationCollector:
        tags:
            - name: 'maiseo.structured_data.collector'

    Maispace\MaiSeo\StructuredData\Collector\FaqCollector:
        tags:
            - name: 'maiseo.structured_data.collector'

    Maispace\MaiSeo\StructuredData\Collector\EventCollector:
        tags:
            - name: 'maiseo.structured_data.collector'

    Maispace\MaiSeo\StructuredData\Collector\WebSiteCollector:
        tags:
            - name: 'maiseo.structured_data.collector'

    Maispace\MaiSeo\StructuredData\Collector\ReviewCollector:
        tags:
            - name: 'maiseo.structured_data.collector'

    Maispace\MaiSeo\EventListener\PageRecordSavedListener:
        tags:
            - name: 'event.listener'
              identifier: 'maiseo/page-record-saved'
              event: Maispace\MaiSeo\Event\PageRecordSavedEvent

    Maispace\MaiSeo\Form\Element\StructuredDataTreeElement:
        tags:
            - name: 'backend.form.element'
              identifier: 'maiseoStructuredDataTree'

    dashboard.widget.maiSeoTrafficGraph:
        class: Maispace\MaiSeo\Widget\AnalyticsWidget
        arguments:
            $options:
                section: graph
                days: 7
        tags:
            - name: dashboard.widget
              identifier: maiSeoTrafficGraph
              groupNames: maiseo
              title: 'LLL:EXT:mai_seo/Resources/Private/Language/locallang_analytics.xlf:widget.graph.title'
              description: 'LLL:EXT:mai_seo/Resources/Private/Language/locallang_analytics.xlf:widget.graph.description'
              iconIdentifier: content-widget-chart-bar
              height: medium
              width: large

    dashboard.widget.maiSeoSitePerformance:
        class: Maispace\MaiSeo\Widget\AnalyticsWidget
        arguments:
            $options:
                section: performance
                days: 7
        tags:
            - name: dashboard.widget
              identifier: maiSeoSitePerformance
              groupNames: maiseo
              title: 'LLL:EXT:mai_seo/Resources/Private/Language/locallang_analytics.xlf:widget.performance.title'
              description: 'LLL:EXT:mai_seo/Resources/Private/Language/locallang_analytics.xlf:widget.performance.description'
              iconIdentifier: content-widget-number
              height: medium
              width: medium

    dashboard.widget.maiSeoTopPages:
        class: Maispace\MaiSeo\Widget\AnalyticsWidget
        arguments:
            $options:
                section: topPages
                days: 7
        tags:
            - name: dashboard.widget
              identifier: maiSeoTopPages
              groupNames: maiseo
              title: 'LLL:EXT:mai_seo/Resources/Private/Language/locallang_analytics.xlf:widget.topPages.title'
              description: 'LLL:EXT:mai_seo/Resources/Private/Language/locallang_analytics.xlf:widget.topPages.description'
              iconIdentifier: content-widget-list
              height: medium
              width: medium

    dashboard.widget.maiSeoTrafficChannel:
        class: Maispace\MaiSeo\Widget\AnalyticsWidget
        arguments:
            $options:
                section: channels
                days: 7
        tags:
            - name: dashboard.widget
              identifier: maiSeoTrafficChannel
              groupNames: maiseo
              title: 'LLL:EXT:mai_seo/Resources/Private/Language/locallang_analytics.xlf:widget.channels.title'
              description: 'LLL:EXT:mai_seo/Resources/Private/Language/locallang_analytics.xlf:widget.channels.description'
              iconIdentifier: content-widget-list
              height: medium
              width: small

    dashboard.widget.maiSeoTrafficDevices:
        class: Maispace\MaiSeo\Widget\AnalyticsWidget
        arguments:
            $options:
                section: devices
                days: 7
        tags:
            - name: dashboard.widget
              identifier: maiSeoTrafficDevices
              groupNames: maiseo
              title: 'LLL:EXT:mai_seo/Resources/Private/Language/locallang_analytics.xlf:widget.devices.title'
              description: 'LLL:EXT:mai_seo/Resources/Private/Language/locallang_analytics.xlf:widget.devices.description'
              iconIdentifier: content-widget-chart-pie
              height: medium
              width: small

    dashboard.widget.maiSeoTrafficBrowsers:
        class: Maispace\MaiSeo\Widget\AnalyticsWidget
        arguments:
            $options:
                section: browsers
                days: 7
        tags:
            - name: dashboard.widget
              identifier: maiSeoTrafficBrowsers
              groupNames: maiseo
              title: 'LLL:EXT:mai_seo/Resources/Private/Language/locallang_analytics.xlf:widget.browsers.title'
              description: 'LLL:EXT:mai_seo/Resources/Private/Language/locallang_analytics.xlf:widget.browsers.description'
              iconIdentifier: content-widget-chart-pie
              height: medium
              width: small

    dashboard.widget.maiSeoTrafficLanguages:
        class: Maispace\MaiSeo\Widget\AnalyticsWidget
        arguments:
            $options:
                section: languages
                days: 7
        tags:
            - name: dashboard.widget
              identifier: maiSeoTrafficLanguages
              groupNames: maiseo
              title: 'LLL:EXT:mai_seo/Resources/Private/Language/locallang_analytics.xlf:widget.languages.title'
              description: 'LLL:EXT:mai_seo/Resources/Private/Language/locallang_analytics.xlf:widget.languages.description'
              iconIdentifier: content-widget-list
              height: medium
              width: small

    dashboard.widget.maiSeoManual:
      class: 'ProudNerds\PnBackendManual\Widgets\ManualWidget'
      arguments:
        $options:
          file: 'EXT:mai_seo/Resources/Private/Manual/Manual.md'
          numbered: true
          contentsDepth: 2
          printButton: true
      tags:
        - name: dashboard.widget
          identifier: 'maiSeoManual'
          groupNames: 'documentation'
          title: 'Handbuch: SEO'
          description: 'Kurze Anleitung für Metadaten, Weiterleitungen und die eigene Statistik.'
          iconIdentifier: 'content-book'
          height: 'medium'
          width: 'medium'
